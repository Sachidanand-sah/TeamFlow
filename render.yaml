# Render Blueprint: one web service (API + Angular app) and a free Key Value (Redis).
# PostgreSQL (Neon), object storage (Supabase) and SMTP (Brevo) are external free
# services; their secrets are entered in the Render dashboard (sync: false).
# Step-by-step guide: docs/deployment.md

services:
  - type: web
    name: teamflow
    runtime: node
    plan: free
    region: singapore
    # Dev dependencies are needed to build (Nx, Angular CLI, Prisma CLI), even though
    # NODE_ENV=production.
    buildCommand: >-
      npm ci --include=dev &&
      npx nx build web --configuration=production &&
      npx nx build api
    # Apply pending migrations, then start. `migrate deploy` only runs committed
    # migration files; it never generates or resets anything.
    startCommand: npx prisma migrate deploy && node dist/apps/api/main.js
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: NX_DAEMON
        value: 'false'
      - key: NX_NO_CLOUD
        value: 'true'
      # Render routes traffic to port 10000.
      - key: PORT
        value: '10000'
      - key: API_PORT
        value: '10000'
      - key: SERVE_WEB_APP
        value: 'true'
      - key: TRUST_PROXY
        value: 'true'
      - key: JWT_ACCESS_SECRET
        generateValue: true
      # https://teamflow-xxxx.onrender.com (your service URL, no trailing slash)
      - key: CORS_ORIGIN
        sync: false
      - key: APP_URL
        sync: false
      # Neon: pooled URL for the app, direct URL for migrations
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: teamflow-queue
          property: connectionString
      # Supabase Storage (S3 protocol)
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        value: teamflow-attachments
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      # Brevo SMTP relay
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_SECURE
        value: 'false'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false

  - type: keyvalue
    name: teamflow-queue
    plan: free
    region: singapore
    # Empty list = no access from the internet; only Render services can connect.
    ipAllowList: []
    # BullMQ requires that Redis never evicts its keys (jobs would silently vanish).
    maxmemoryPolicy: noeviction
