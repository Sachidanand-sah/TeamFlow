<div class="backdrop" (click)="closed.emit()" aria-hidden="true"></div>

<aside
  class="panel"
  role="dialog"
  aria-modal="true"
  [attr.aria-labelledby]="'task-panel-title'"
>
  <header class="panel__header">
    <span id="task-panel-title" class="panel__key">{{ task().key }}</span>
    <button
      type="button"
      class="panel__close"
      aria-label="Close"
      (click)="closed.emit()"
    >
      ×
    </button>
  </header>

  <form class="panel__form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <tf-form-field label="Title" for="task-title" [error]="titleError()">
      <input
        #titleInput
        id="task-title"
        type="text"
        formControlName="title"
        aria-describedby="task-title-error"
      />
    </tf-form-field>

    <div class="panel__row">
      <div class="select-field">
        <label for="task-status">Status</label>
        <select
          id="task-status"
          [disabled]="!canEdit() || busy()"
          (change)="onStatusSelected($event)"
        >
          @for (status of statuses; track status) {
            <option [value]="status" [selected]="status === task().status">
              {{ statusLabels[status] }}
            </option>
          }
        </select>
      </div>

      <div class="select-field">
        <label for="task-priority">Priority</label>
        <select id="task-priority" formControlName="priority">
          @for (priority of priorities; track priority) {
            <option [value]="priority">{{ priority.toLowerCase() }}</option>
          }
        </select>
      </div>

      <div class="select-field">
        <label for="task-assignee">Assignee</label>
        <select id="task-assignee" formControlName="assigneeId">
          <option value="">Unassigned</option>
          @for (member of members(); track member.userId) {
            <option [value]="member.userId">{{ member.name }}</option>
          }
        </select>
      </div>
    </div>

    <tf-form-field label="Description" for="task-description">
      <textarea
        id="task-description"
        rows="8"
        formControlName="description"
      ></textarea>
    </tf-form-field>

    @if (task().reporter; as reporter) {
      <p class="panel__meta">Reported by {{ reporter.name }}</p>
    }

    @if (error(); as message) {
      <p class="panel__error" role="alert">{{ message }}</p>
    }

    @if (canEdit()) {
      <div class="panel__actions">
        <tf-button type="submit" [loading]="busy()">Save</tf-button>
        @if (canDelete()) {
          <tf-button
            variant="secondary"
            [disabled]="busy()"
            (click)="confirmRemove()"
          >
            Delete
          </tf-button>
        }
      </div>
    }
  </form>

  <!-- Extra sections from the parent, e.g. the comment thread. -->
  <ng-content />
</aside>
