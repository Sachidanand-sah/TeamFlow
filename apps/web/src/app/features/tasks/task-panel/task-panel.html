<div class="backdrop" (click)="closed.emit()" aria-hidden="true"></div>

<aside
  class="panel"
  role="dialog"
  aria-modal="true"
  [attr.aria-labelledby]="'task-panel-title'"
>
  <header class="panel__header">
    <span id="task-panel-title" class="panel__key">{{ task().key }}</span>
    @if (task().reporter; as reporter) {
      <span class="panel__meta">Reported by {{ reporter.name }}</span>
    }
    <button
      type="button"
      class="panel__close"
      aria-label="Close"
      (click)="closed.emit()"
    >
      <tf-icon name="x" [size]="18" />
    </button>
  </header>

  <div class="panel__body">
    <form
      class="panel__form"
      [formGroup]="form"
      (ngSubmit)="submit()"
      novalidate
    >
      <tf-form-field label="Title" for="task-title" [error]="titleError()">
        <input
          #titleInput
          id="task-title"
          class="panel__title-input"
          type="text"
          formControlName="title"
          aria-describedby="task-title-error"
        />
      </tf-form-field>

      <dl class="props">
        <dt><label for="task-status">Status</label></dt>
        <dd>
          <select
            id="task-status"
            [disabled]="!canEdit() || busy()"
            (change)="onStatusSelected($event)"
          >
            @for (status of statuses; track status) {
              <option [value]="status" [selected]="status === task().status">
                {{ statusLabels[status] }}
              </option>
            }
          </select>
        </dd>

        <dt><label for="task-priority">Priority</label></dt>
        <dd>
          <select id="task-priority" formControlName="priority">
            @for (priority of priorities; track priority) {
              <option [value]="priority">{{ priorityLabel(priority) }}</option>
            }
          </select>
        </dd>

        <dt><label for="task-assignee">Assignee</label></dt>
        <dd>
          <select id="task-assignee" formControlName="assigneeId">
            <option value="">Unassigned</option>
            @for (member of members(); track member.userId) {
              <option [value]="member.userId">{{ member.name }}</option>
            }
          </select>
        </dd>
      </dl>

      <tf-form-field label="Description" for="task-description">
        <textarea
          id="task-description"
          rows="6"
          placeholder="Add more detail…"
          formControlName="description"
        ></textarea>
      </tf-form-field>

      @if (error(); as message) {
        <p class="tf-alert tf-alert--danger" role="alert">{{ message }}</p>
      }

      @if (canEdit()) {
        <div class="panel__actions">
          @if (canDelete()) {
            <tf-button
              variant="danger"
              [disabled]="busy()"
              (click)="confirmRemove()"
            >
              <tf-icon name="trash" />
              Delete
            </tf-button>
          }
          <span class="panel__spacer"></span>
          <tf-button type="submit" [loading]="busy()">
            <tf-icon name="check" />
            Save changes
          </tf-button>
        </div>
      }
    </form>

    <!-- Extra sections from the parent, e.g. attachments and the comment thread. -->
    <ng-content />
  </div>
</aside>
