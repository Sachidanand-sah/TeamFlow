<tf-auth-layout>
  <section aria-labelledby="login-title">
    <header class="auth-header">
      <h1 id="login-title">Sign in to TeamFlow</h1>
      <p>Welcome back! Enter your details to continue.</p>
    </header>

    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <tf-form-field label="Email" for="email" [error]="fieldError('email')">
        <input
          id="email"
          type="email"
          autocomplete="email"
          placeholder="you@company.com"
          formControlName="email"
          aria-describedby="email-error"
        />
      </tf-form-field>

      <tf-form-field
        label="Password"
        for="password"
        [error]="fieldError('password')"
      >
        <div class="password">
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            autocomplete="current-password"
            placeholder="••••••••••••"
            formControlName="password"
            aria-describedby="password-error"
          />
          <button
            type="button"
            class="password__toggle"
            [attr.aria-label]="showPassword() ? 'Hide' : 'Show'"
            [attr.aria-pressed]="showPassword()"
            (click)="showPassword.set(!showPassword())"
          >
            <tf-icon [name]="showPassword() ? 'eye-off' : 'eye'" />
          </button>
        </div>
      </tf-form-field>

      @if (serverError(); as message) {
        <p class="tf-alert tf-alert--danger" role="alert">{{ message }}</p>
      }

      <tf-button
        type="submit"
        size="lg"
        [block]="true"
        [loading]="submitting()"
      >
        Sign in
      </tf-button>
    </form>

    <p class="auth-switch">
      New to TeamFlow? <a routerLink="/register">Create an account</a>
    </p>
  </section>
</tf-auth-layout>
